// ---------- tiny offline QR code generator (byte mode, error correction M, versions 1-10) ----------
function makeQr(text) {
  const bytes = [];
  for (let i = 0; i < text.length; i++) {
    let c = text.charCodeAt(i);
    if (c >= 0xd800 && c < 0xdc00 && i + 1 < text.length) { c = 0x10000 + ((c - 0xd800) << 10) + (text.charCodeAt(++i) - 0xdc00); }
    if (c < 0x80) bytes.push(c);
    else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0x10000) bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else bytes.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  const ECC_PER_BLOCK = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const NUM_BLOCKS = [0, 1, 1, 2, 2, 2, 4, 4, 4, 5, 5];
  const rawModules = (v) => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const a = Math.floor(v / 7) + 2; r -= (25 * a - 10) * a - 55; if (v >= 7) r -= 36; }
    return r;
  };
  let ver = 0, dataCap = 0;
  for (let v = 1; v <= 10; v++) {
    const cap = Math.floor(rawModules(v) / 8) - ECC_PER_BLOCK[v] * NUM_BLOCKS[v];
    const need = Math.ceil((4 + (v <= 9 ? 8 : 16) + 8 * bytes.length) / 8);
    if (need <= cap) { ver = v; dataCap = cap; break; }
  }
  if (!ver) throw new Error('QR text too long');
  const size = ver * 4 + 17;

  // data bits
  const bits = [];
  const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(4, 4); put(bytes.length, ver <= 9 ? 8 : 16); bytes.forEach((b) => put(b, 8));
  put(0, Math.min(4, dataCap * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  for (let pad = 0xec; bits.length < dataCap * 8; pad ^= 0xec ^ 0x11) put(pad, 8);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }

  // Reed-Solomon
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z; };
  const eccLen = ECC_PER_BLOCK[ver];
  const div = new Array(eccLen - 1).fill(0).concat([1]);
  let root = 1;
  for (let i = 0; i < eccLen; i++) {
    for (let j = 0; j < div.length; j++) { div[j] = mul(div[j], root); if (j + 1 < div.length) div[j] ^= div[j + 1]; }
    root = mul(root, 2);
  }
  const remainder = (d) => {
    const r = new Array(div.length).fill(0);
    for (const b of d) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); }
    return r;
  };
  const nb = NUM_BLOCKS[ver], raw = Math.floor(rawModules(ver) / 8);
  const shortBlocks = nb - (raw % nb), shortLen = Math.floor(raw / nb);
  const blocks = [];
  for (let i = 0, k = 0; i < nb; i++) {
    const d = data.slice(k, k + shortLen - eccLen + (i < shortBlocks ? 0 : 1));
    k += d.length;
    const e = remainder(d);
    if (i < shortBlocks) d.push(0);
    blocks.push(d.concat(e));
  }
  const all = [];
  for (let i = 0; i < blocks[0].length; i++) {
    blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= shortBlocks) all.push(b[i]); });
  }

  // matrix
  const mod = Array.from({ length: size }, () => new Array(size).fill(false));
  const fn = Array.from({ length: size }, () => new Array(size).fill(false));
  const setFn = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
  for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
  const finder = (cx, cy) => {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
      if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, d !== 2 && d !== 4);
    }
  };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
  if (ver >= 2) {
    const n = Math.floor(ver / 7) + 2;
    const step = Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
    const pos = [6];
    for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
    pos.forEach((px, i) => pos.forEach((py, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(px + dx, py + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
  }
  const bit = (x, i) => ((x >>> i) & 1) !== 0;
  const drawFormat = (m) => {
    const d = (0 << 3) | m; // ECC level M = 0
    let r = d;
    for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const b = ((d << 10) | r) ^ 0x5412;
    for (let i = 0; i <= 5; i++) setFn(8, i, bit(b, i));
    setFn(8, 7, bit(b, 6)); setFn(8, 8, bit(b, 7)); setFn(7, 8, bit(b, 8));
    for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(b, i));
    for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(b, i));
    for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(b, i));
    setFn(8, size - 8, true);
  };
  drawFormat(0);
  if (ver >= 7) {
    let r = ver;
    for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
    const b = (ver << 12) | r;
    for (let i = 0; i < 18; i++) {
      const dark = bit(b, i), a = size - 11 + (i % 3), c = Math.floor(i / 3);
      setFn(a, c, dark); setFn(c, a, dark);
    }
  }
  // codewords, zig-zag
  let bi = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j, upward = ((right + 1) & 2) === 0, y = upward ? size - 1 - vert : vert;
        if (!fn[y][x] && bi < all.length * 8) { mod[y][x] = bit(all[bi >>> 3], 7 - (bi & 7)); bi++; }
      }
    }
  }
  const applyMask = (m) => {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      let inv;
      switch (m) {
        case 0: inv = (x + y) % 2 === 0; break;
        case 1: inv = y % 2 === 0; break;
        case 2: inv = x % 3 === 0; break;
        case 3: inv = (x + y) % 3 === 0; break;
        case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
        case 5: inv = ((x * y) % 2) + ((x * y) % 3) === 0; break;
        case 6: inv = (((x * y) % 2) + ((x * y) % 3)) % 2 === 0; break;
        default: inv = (((x + y) % 2) + ((x * y) % 3)) % 2 === 0;
      }
      if (!fn[y][x] && inv) mod[y][x] = !mod[y][x];
    }
  };
  const penalty = () => {
    let res = 0;
    const hist = (h, len) => { if (h[0] === 0) len += size; h.pop(); h.unshift(len); };
    const count = (h) => {
      const n = h[1];
      const core = n > 0 && h[2] === n && h[3] === n * 3 && h[4] === n && h[5] === n;
      return (core && h[0] >= n * 4 && h[6] >= n ? 1 : 0) + (core && h[6] >= n * 4 && h[0] >= n ? 1 : 0);
    };
    const finish = (color, len, h) => { if (color) { hist(h, len); len = 0; } len += size; hist(h, len); return count(h); };
    for (let pass = 0; pass < 2; pass++) {
      for (let a = 0; a < size; a++) {
        let color = false, run = 0; const h = [0, 0, 0, 0, 0, 0, 0];
        for (let b = 0; b < size; b++) {
          const v = pass === 0 ? mod[a][b] : mod[b][a];
          if (v === color) { run++; if (run === 5) res += 3; else if (run > 5) res++; }
          else { hist(h, run); if (!color) res += count(h) * 40; color = v; run = 1; }
        }
        res += finish(color, run, h) * 40;
      }
    }
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
      const c = mod[y][x];
      if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) res += 3;
    }
    let dark = 0; mod.forEach((r) => r.forEach((v) => { if (v) dark++; }));
    res += (Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1) * 10;
    return res;
  };
  let best = 0, bestPen = Infinity;
  for (let m = 0; m < 8; m++) {
    applyMask(m); drawFormat(m);
    const p = penalty();
    if (p < bestPen) { best = m; bestPen = p; }
    applyMask(m);
  }
  applyMask(best); drawFormat(best);
  return mod;
}

  });

function shrink(file,w){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,w/img.width),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Could not resize the image')),'image/jpeg',0.7)};img.onerror=()=>no(new Error('Cannot read this image'));img.src=u})}

async function orders(){
  const r=await sb.from('orders').select('*, order_items('+OI+')').order('id',{ascending:false}).limit(60);if(r.error)throw r.error;
  const d=r.data.sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));V.ol=d;
  return head('Orders')+'<div class="pad"><p class="mu">Check the payment (cash in hand, or GPay in your UPI app), then tap how the customer paid.</p>'+(d.length?d.map((o,ix)=>ordCard(o,ix,true)).join(''):'<p class="mu">No orders yet.</p>')+'</div>';
}
function ordCard(o,ix,act){
  return '<div class="card"><div class="row2" style="margin:0"><b>'+esc(o.receipt_no)+'</b> \u00B7 '+rs(o.total)+'<span class="fl"></span><span class="tag '+esc(o.status)+'">'+esc(o.status)+'</span></div><div>'+esc(o.customer_name||'(no name)')+(o.customer_phone?' \u00B7 '+esc(o.customer_phone):'')+'</div><div class="mu">'+esc(new Date(o.created_at).toLocaleString())+(o.status==='approved'?' \u00B7 '+payName(o.method)+(o.handled_by_email?' \u00B7 by '+esc(o.handled_by_email.split('@')[0]):''):'')+'</div>'+o.order_items.map(i=>'<div>'+i.qty+' \u00D7 '+esc(i.brand_name||'')+' '+esc(i.model_name||'')+' \u2013 '+esc(i.case_name)+' ('+rs(i.unit_price)+')</div>').join('')+'<div class="row2">'+(act&&o.status==='pending'?'<button class="bt" onclick="decide('+o.id+',\'approve_order\',\'cash\')">Approve \u2013 Cash</button><button class="bt" onclick="decide('+o.id+',\'approve_order\',\'upi\')">Approve \u2013 GPay</button><button class="bt bad2" onclick="decide('+o.id+',\'reject_order\')">Reject</button>':'')+'<button class="bt alt" onclick="showBill(billOf(V.ol['+ix+']))">Bill</button></div></div>';
}
async function decide(id,fn,method){if(S.busy)return;S.busy=1;const a={p_order_id:id};if(method)a.p_method=method;const r=await sb.rpc(fn,a);S.busy=0;if(r.error)alert(r.error.message);render()}
/* ---------- bill ---------- */
function billHtml(b){
  const rows=b.items.map(i=>'<tr><td>'+esc(i.name)+'<div class="mu">'+esc((i.brand||'')+' '+(i.model||''))+'</div></td><td class="r">'+i.qty+' \u00D7 '+rs(i.unit)+'</td><td class="r">'+rs(i.qty*i.unit)+'</td></tr>').join('');
  return '<div class="billbox"><div class="bh">'+esc(S.shop)+'</div><div class="mu">Bill '+esc(b.no)+' \u00B7 '+esc(new Date(b.date).toLocaleString())+'</div><div>'+esc(b.name||'')+(b.phone?' \u00B7 '+esc(b.phone):'')+'</div><table class="btb">'+rows+'</table><div class="tot">Total '+rs(b.total)+'</div>'+(b.pay?'<div>Paid by '+esc(b.pay)+'</div>':'')+'<div class="mu">Thank you!</div></div>';
}
function payName(m){return m==='upi'?'GPay / UPI':m==='cash'?'Cash':'Not paid yet'}
function billOf(o){return {no:o.receipt_no,date:o.decided_at||o.created_at,name:o.customer_name,phone:o.customer_phone,total:o.total,pay:o.status==='approved'?payName(o.method):'',items:(o.order_items||[]).map(i=>({name:i.case_name,brand:i.brand_name,model:i.model_name,qty:i.qty,unit:i.unit_price}))}}
function showBill(b){
  const o=document.createElement('div');o.id='billov';o.style.cssText='position:fixed;inset:0;background:#0009;z-index:9999;overflow:auto;padding:16px';
  o.innerHTML='<div style="background:#fff;color:#000;border-radius:12px;padding:16px;max-width:380px;margin:0 auto">'+billHtml(b)+'<div class="row2 noprint"><button class="bt" onclick="window.print()">Print</button><button class="bt alt" onclick="document.getElementById(\'billov\').remove()">Close</button></div></div>';
  document.body.appendChild(o);
}

const DPAL=['#a855f7','#ec4899','#22d3ee','#f59e0b','#34d399','#94a3b8'];
const m$=n=>rs(Math.round(n).toLocaleString('en-IN'));
const sname=e=>e?String(e).split('@')[0]:'Not recorded';
const thm=()=>{try{return localStorage.getItem('dthm')||'1'}catch(e){return '1'}};
function setThm(n){try{localStorage.setItem('dthm',n)}catch(e){}render()}
function dSet(k){V.p=k;V.rk=null;render()}
function dGo(){V.from=$('df').value;V.to=$('dt').value||$('df').value;if(!V.from)return alert('Pick the start date');V.p='c';V.rk=null;render()}
function dTab(t,sub){V.tab=t;if(sub)V.ps=sub;render();window.scrollTo(0,0)}
function tg(k,v){V[k]=v;render()}
function tgl(k,cur,opts){return '<span class="tgl">'+opts.map(o=>'<button class="'+(cur===o[0]?'on':'')+'" onclick="tg(\''+k+'\',\''+o[0]+'\')">'+o[1]+'</button>').join('')+'</span>'}
function dRange(){
  const p=V.p||'7';let a=new Date(),b=null;a.setHours(0,0,0,0);
  if(p==='a')return [null,null];
  if(p==='7')a.setDate(a.getDate()-6);
  else if(p==='30')a.setDate(a.getDate()-29);
  else if(p==='c'){const x=new Date((V.from||'')+'T00:00:00'),y=new Date((V.to||V.from||'')+'T23:59:59');if(!isNaN(x)&&!isNaN(y)){a=x;b=y}}
  return [a.toISOString(),b?b.toISOString():null];
}
function crunch(rep,cs,a,b){
  const D={rev:0,prof:0,cash:0,upi:0,bills:rep.orders.length,sold:0,noCost:0,revC:0,pr:{},st:{},dy:{},orders:rep.orders,en:b};
  D.st0=a||(rep.orders.length?rep.orders[rep.orders.length-1].decided_at:new Date().toISOString());
  D.mon=((b?new Date(b):new Date())-new Date(D.st0))/864e5>62;
  const gk=d=>{const x=new Date(d).toLocaleDateString('en-CA');return D.mon?x.slice(0,7):x};
  rep.orders.forEach(o=>{
    D.rev+=o.total;if(o.method==='cash')D.cash+=o.total;else if(o.method==='upi')D.upi+=o.total;
    const sk=sname(o.handled_by_email);
    const s=D.st[sk]||(D.st[sk]={n:sk,bills:0,rev:0,prof:0,cash:0,upi:0});
    s.bills++;s.rev+=o.total;if(o.method==='cash')s.cash+=o.total;else if(o.method==='upi')s.upi+=o.total;
    const k=gk(o.decided_at),d=D.dy[k]||(D.dy[k]={k:k,rev:0,prof:0});d.rev+=o.total;
    o.order_items.forEach(i=>{
      D.sold+=i.qty;const id=i.case_id||('x'+i.case_name);
      const p=D.pr[id]||(D.pr[id]={id:i.case_id,n:i.case_name,m:i.model_name,qty:0,rev:0,prof:0});
      p.qty+=i.qty;p.rev+=i.unit_price*i.qty;
      if(i.cost_price==null)D.noCost+=i.qty;
      else{const g=(i.unit_price-i.cost_price)*i.qty;p.prof+=g;D.prof+=g;s.prof+=g;d.prof+=g;D.revC+=i.unit_price*i.qty}
    });
  });
  const cost={};rep.costs.forEach(x=>{cost[x.case_id]=x.cost_price});
  D.cases=cs;
  D.stockCost=cs.reduce((t,x)=>t+(cost[x.id]==null?0:x.qty*cost[x.id]),0);
  D.stockSell=cs.reduce((t,x)=>t+x.qty*(x.offer_price!=null?x.offer_price:(x.price||0)),0);
  return D;
}
function series(D){
  const out=[],s=new Date(D.st0),e=D.en?new Date(D.en):new Date();
  if(D.mon){s.setDate(1);while(s<=e&&out.length<60){const k=s.toLocaleDateString('en-CA').slice(0,7);out.push(D.dy[k]||{k:k,rev:0,prof:0});s.setMonth(s.getMonth()+1)}}
  else{s.setHours(0,0,0,0);while(s<=e&&out.length<70){const k=s.toLocaleDateString('en-CA');out.push(D.dy[k]||{k:k,rev:0,prof:0});s.setDate(s.getDate()+1)}}
  return out;
}
function mkParts(list,vk,nk,fmt){
  const a=list.filter(x=>x[vk]>0).sort((p,q)=>q[vk]-p[vk]),top=a.slice(0,5),rest=a.slice(5).reduce((t,x)=>t+x[vk],0);
  const r=top.map((x,i)=>({n:x[nk],v:x[vk],c:DPAL[i],l:fmt(x[vk])}));
  if(rest>0)r.push({n:'Others',v:rest,c:DPAL[5],l:fmt(rest)});
  return r;
}
function donutH(parts){
  const t=parts.reduce((x,y)=>x+y.v,0);if(!t)return '<p class="dmu">No sales in this period.</p>';
  let off=0;
  const arcs=parts.map(x=>{const pc=x.v*100/t,s='<circle r="15.9155" cx="21" cy="21" fill="none" stroke="'+x.c+'" stroke-width="6" stroke-dasharray="'+pc.toFixed(2)+' '+(100-pc).toFixed(2)+'" stroke-dashoffset="'+(25-off).toFixed(2)+'"/>';off+=pc;return s}).join('');
  return '<div class="dn"><svg viewBox="0 0 42 42" width="140" height="140">'+arcs+'</svg><div class="lgd">'+parts.map(x=>'<div><i style="background:'+x.c+'"></i>'+esc(x.n)+' <b>'+Math.round(x.v*100/t)+'%</b></div>').join('')+'</div></div>';
}
function barsH(parts){
  if(!parts.length)return '<p class="dmu">No sales in this period.</p>';
  const t=Math.max.apply(null,parts.map(x=>x.v).concat([1]));
  return parts.map(x=>'<div class="bh2"><span>'+esc(x.n)+'</span><div><u style="width:'+Math.round(x.v*100/t)+'%;background:'+x.c+'"></u></div><b>'+x.l+'</b></div>').join('');
}
function lineH(sr){
  if(!sr.length)return '<p class="dmu">No data.</p>';
  const W=300,H=110,n=sr.length,mx=Math.max.apply(null,sr.map(x=>Math.max(x.rev,x.prof)).concat([1]));
  const pt=(v,i)=>(n>1?i*(W-10)/(n-1)+5:W/2).toFixed(1)+','+(H-8-v*(H-20)/mx).toFixed(1);
  const pl=(k,c)=>'<polyline fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round" points="'+sr.map((x,i)=>pt(x[k],i)).join(' ')+'"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+pl('rev','var(--dac)')+pl('prof','var(--dac2)')+'</svg>'+trendFoot(sr);
}
function colH(sr){
  if(!sr.length)return '<p class="dmu">No data.</p>';
  const mx=Math.max.apply(null,sr.map(x=>x.rev).concat([1]));
  return '<div class="cols">'+sr.map(x=>'<div class="col"><u style="height:'+Math.round(x.rev*100/mx)+'%"></u></div>').join('')+'</div>'+trendFoot(sr);
}
function trendFoot(sr){return '<div class="dbt dmu"><span>'+esc(sr[0].k)+'</span><span style="color:var(--dac)">\u25CF Sales</span><span style="color:var(--dac2)">\u25CF Profit</span><span>'+esc(sr[sr.length-1].k)+'</span></div>'}
const drw=(a,b,c)=>'<div class="drw"><span>'+esc(a)+(b?'<small>'+esc(b)+'</small>':'')+'</span><b>'+c+'</b></div>';
const mnm=id=>(S.models.find(m=>m.id===id)||{}).name||'';
function dChips(){
  const c=(k,t)=>'<button class="dch'+(V.p===k?' on':'')+'" onclick="dSet(\''+k+'\')">'+t+'</button>';
  return '<div class="dchs">'+c('t','Today')+c('7','7 days')+c('30','30 days')+c('a','All')+c('c','Pick dates')+'</div>'+(V.p==='c'?'<div class="dr"><input type="date" id="df" value="'+esc(V.from||'')+'"><input type="date" id="dt" value="'+esc(V.to||'')+'"><button class="dch on" onclick="dGo()">Search</button></div>':'');
}
function chartTrend(D){
  const v=V.c1||'a',sr=series(D);
  return '<div class="dbx"><div class="dbt"><b>Sales trend</b>'+tgl('c1',v,[['a','Line'],['b','Bars']])+'</div>'+(v==='a'?lineH(sr):colH(sr))+'</div>';
}
function chartShare(D){
  const w=V.sh||'p',v=V.c2||'a';
  const parts=w==='p'?mkParts(Object.values(D.pr),'qty','n',x=>x+' pcs'):mkParts(Object.values(D.st),'rev','n',m$);
  return '<div class="dbx"><div class="dbt"><b>Share</b>'+tgl('c2',v,[['a','Donut'],['b','Bars']])+'</div><div style="margin-bottom:8px">'+tgl('sh',w,[['p','Products'],['s','Staff']])+'</div>'+(v==='a'?donutH(parts):barsH(parts))+'</div>';
}
function dOv(D){
  const mg=D.revC?Math.round(D.prof*100/D.revC)+'%':'-';
  const kp=(t,v,s)=>'<div class="dk"><div class="dmu">'+t+'</div><div class="dv">'+v+'</div>'+(s?'<div class="dmu">'+s+'</div>':'')+'</div>';
  const pl=Object.values(D.pr),fast=pl.slice().sort((a,b)=>b.qty-a.qty),best=pl.filter(x=>x.prof>0).sort((a,b)=>b.prof-a.prof);
  const stuck=D.cases.filter(x=>x.qty>0&&!D.pr[x.id]).sort((a,b)=>b.qty-a.qty),stf=Object.values(D.st).sort((a,b)=>b.rev-a.rev),low=D.cases.filter(x=>x.qty<=2);
  const bx=(t,body,tab,sub)=>'<div class="dbx" onclick="dTab(\''+tab+'\''+(sub?',\''+sub+'\'':'')+')"><div class="dbt"><b>'+t+'</b><span class="dmu">View all \u203A</span></div>'+body+'</div>';
  const t3=(a,f)=>a.length?a.slice(0,3).map(f).join(''):'<div class="dmu">Nothing yet</div>';
  return '<div class="dks">'+kp('Total sales',m$(D.rev),D.bills+' bills')+kp('Profit',m$(D.prof),'margin '+mg)+kp('Cash',m$(D.cash))+kp('GPay / UPI',m$(D.upi))+'</div>'
   +(D.noCost?'<p class="dmu">'+D.noCost+' sold cases have no cost price, so their profit is not counted.</p>':'')
   +bx('Fast selling',t3(fast,x=>drw(x.n,x.m,x.qty+' sold')),'prod','fast')
   +bx('Most profit',t3(best,x=>drw(x.n,x.m,m$(x.prof))),'prod','profit')
   +bx('Not selling',t3(stuck,x=>drw(x.name,mnm(x.model_id),x.qty+' in stock')),'prod','none')
   +bx('Staff performance',t3(stf,x=>drw(x.n,x.bills+' bills',m$(x.rev))),'staff')
   +bx('Stock',drw('Low or out of stock',null,low.length)+drw('Stock value (cost)',null,m$(D.stockCost)),'stock')
   +chartTrend(D)+chartShare(D);
}
function dSales(D){
  const v=V.c3||'a';
  const parts=[{n:'Cash',v:D.cash,c:DPAL[0],l:m$(D.cash)},{n:'GPay / UPI',v:D.upi,c:DPAL[1],l:m$(D.upi)}].filter(x=>x.v>0);
  const sr=series(D).filter(x=>x.rev>0).reverse();
  return '<div class="dbx"><div class="dbt"><b>Cash vs GPay</b>'+tgl('c3',v,[['a','Donut'],['b','Bars']])+'</div>'+(v==='a'?donutH(parts):barsH(parts))+'</div>'
   +chartTrend(D)
   +'<div class="dbx"><div class="dbt"><b>Day by day</b></div>'+(sr.length?sr.map(x=>drw(x.k,'profit '+m$(x.prof),m$(x.rev))).join(''):'<div class="dmu">No sales in this period.</div>')+'</div>'
   +'<div class="dbx"><div class="dbt"><b>Recent bills</b></div>'+(D.orders.length?D.orders.slice(0,30).map(o=>drw(o.receipt_no+' \u00B7 '+(o.customer_name||''),(o.method==='upi'?'GPay':'Cash')+' \u00B7 '+sname(o.handled_by_email)+' \u00B7 '+new Date(o.decided_at).toLocaleDateString(),m$(o.total))).join(''):'<div class="dmu">No bills yet.</div>')+'</div>';
}
function dProd(D){
  const s=V.ps||'fast',pl=Object.values(D.pr);
  const chip=(k,t)=>'<button class="dch'+(s===k?' on':'')+'" onclick="tg(\'ps\',\''+k+'\')">'+t+'</button>';
  let rows;
  if(s==='none')rows=D.cases.filter(x=>x.qty>0&&!D.pr[x.id]).sort((a,b)=>b.qty-a.qty).map(x=>drw(x.name,mnm(x.model_id),x.qty+' in stock'));
  else rows=pl.sort((a,b)=>s==='profit'?b.prof-a.prof:b.qty-a.qty).map(x=>drw(x.n,x.m+' \u00B7 '+m$(x.rev)+' sales',x.qty+' sold \u00B7 '+m$(x.prof)));
  return '<div class="dchs">'+chip('fast','Fast selling')+chip('profit','Most profit')+chip('none','Not selling')+'</div><div class="dbx">'+(rows.length?rows.join(''):'<div class="dmu">Nothing yet.</div>')+'</div>';
}
function dStaff(D){
  const L=Object.values(D.st).sort((a,b)=>b.rev-a.rev),v=V.c2||'a';
  const parts=mkParts(L,'rev','n',m$);
  return '<div class="dbx"><div class="dbt"><b>Staff share</b>'+tgl('c2',v,[['a','Donut'],['b','Bars']])+'</div>'+(v==='a'?donutH(parts):barsH(parts))+'</div>'
   +L.map(x=>'<div class="dbx"><div class="dbt"><b>'+esc(x.n)+'</b><span class="dv" style="font-size:18px">'+m$(x.rev)+'</span></div>'+drw('Bills',null,x.bills)+drw('Profit',null,m$(x.prof))+drw('Cash',null,m$(x.cash))+drw('GPay / UPI',null,m$(x.upi))+'</div>').join('')
   +(L.length?'':'<div class="dbx dmu">No sales in this period.</div>');
}
function dStock(D){
  const all=D.cases.slice().sort((a,b)=>a.qty-b.qty),units=all.reduce((t,x)=>t+x.qty,0);
  return '<div class="dks"><div class="dk"><div class="dmu">Units in stock</div><div class="dv">'+units+'</div></div><div class="dk"><div class="dmu">Out of stock</div><div class="dv">'+all.filter(x=>x.qty<=0).length+'</div></div><div class="dk"><div class="dmu">Value at cost</div><div class="dv">'+m$(D.stockCost)+'</div></div><div class="dk"><div class="dmu">Value at selling price</div><div class="dv">'+m$(D.stockSell)+'</div></div></div>'
   +'<div class="dbx"><div class="dbt"><b>All cases (lowest stock first)</b></div>'+(all.length?all.map(x=>drw(x.name,mnm(x.model_id),x.qty<=0?'Out':x.qty+' pcs')).join(''):'<div class="dmu">No cases yet.</div>')+'</div>';
}
async function dash(){
  if(!fnd())return head('Dashboard')+'<div class="pad"><p class="mu">Only the founder ID can open the dashboard.</p></div>';
  V.tab=V.tab||'ov';V.p=V.p||'7';
  const r=dRange(),key=r[0]+'|'+r[1];
  if(V.rk!==key||!V.rep){
    const q=await Promise.all([sb.rpc('founder_report',{p_since:r[0],p_until:r[1]}),sb.from('cases').select('id,name,qty,model_id,price,offer_price').is('deleted_at',null)]);
    if(q[0].error)throw q[0].error;if(q[1].error)throw q[1].error;
    V.rep=crunch(q[0].data,q[1].data,r[0],r[1]);V.rk=key;
  }
  const D=V.rep,t=V.tab,names={ov:'Dashboard',sales:'Sales',prod:'Products',staff:'Staff',stock:'Stock'};
  const body=t==='sales'?dSales(D):t==='prod'?dProd(D):t==='staff'?dStaff(D):t==='stock'?dStock(D):dOv(D);
  return '<div class="dbw th'+thm()+'">'+head(names[t]||'Dashboard')+'<div class="dpad">'+dChips()+body+'<div class="dthm"><span class="dmu">Design</span>'+['1','2','3'].map(n=>'<button class="dch'+(thm()===n?' on':'')+'" onclick="setThm(\''+n+'\')">'+n+'</button>').join('')+'<button class="dch" onclick="V.rk=null;render()">Refresh</button></div></div></div>';
}
/* ---------- counter billing (staff) ---------- */
async function counterSale(method){
  if(S.busy)return;
  const name=(S.cn||'').trim(),phone=(S.cp||'').replace(/\D/g,'');
  if(phone&&phone.length!==10)return alert('Mobile number must be 10 digits');
  S.busy=1;const lines=S.cart.slice();
  const r=await sb.rpc('counter_sale',{p_items:lines.map(l=>({case_id:l.id,qty:l.qty})),p_name:name,p_phone:phone,p_method:method});S.busy=0;
  if(r.error)return alert(r.error.message);
  S.cart=[];S.cn='';S.cp='';stack=[];
  V={n:'receipt',b:{no:r.data.receipt_no,date:new Date().toISOString(),name:name||'Walk-in customer',phone:phone,total:r.data.total,pay:payName(method),items:lines.map(l=>({name:l.name,brand:l.brand,model:l.model,qty:l.qty,unit:l.unit}))}};
  try{await base()}catch(e){}render();
}
/* ---------- customer history ---------- */
function hist(){return head('Customer history')+'<div class="pad"><label>Customer mobile number</label><input class="in" id="hp" type="tel" inputmode="numeric" placeholder="10 digit number" value="'+esc(V.hp||'')+'"><button class="bt wide" onclick="histGo()">Search</button><div id="hr">'+(V.hr||'')+'</div></div>'}
function histRows(d){
  if(!d.length)return '<p class="mu">No purchases found for this number.</p>';
  const ok=d.filter(o=>o.status==='approved'),tot=ok.reduce((a,o)=>a+o.total,0);
  return '<div class="card"><b>'+esc(d[0].customer_name||'')+'</b> \u00B7 '+ok.length+' purchase(s) \u00B7 '+rs(tot)+' total</div>'+d.map((o,ix)=>ordCard(o,ix,false)).join('');
}
async function histGo(){
  const dg=($('hp').value||'').replace(/\D/g,'');if(dg.length<4)return alert('Enter at least 4 digits of the number');
  const r=await sb.from('orders').select('*, order_items('+OI+')').like('customer_phone','%'+dg+'%').order('id',{ascending:false}).limit(100);
  if(r.error)return alert(r.error.message);
  V.hp=dg;V.ol=r.data;V.hr=histRows(r.data);$('hr').innerHTML=V.hr;
}
function settings(){return head('Settings')+'<div class="pad"><label>Shop name</label><input class="in" id="sn" value="'+esc(S.shop)+'"><label>Shop UPI ID</label><input class="in" id="su" value="'+esc(S.upi)+'" placeholder="name@bank"><button class="bt wide" onclick="saveSet()">Save</button><button class="bt wide alt" onclick="logout()">Sign out</button></div>'}
async function saveSet(){const n=$('sn').value.trim()||'Mobile Shop',u=$('su').value.trim();const r=await sb.from('settings').upsert([{key:'shop_name',value:n},{key:'upi_id',value:u}]);if(r.error)return alert(r.error.message);S.shop=n;S.upi=u;toast('Saved')}
async function logout(){await sb.auth.signOut();S.user=null;S.founder=false;stack=[];V={n:'home'};if(location.hash)location.hash='';else render()}
function loginView(){return head(MODE()==='founder'?'Founder login':'Staff login')+'<div class="pad"><input class="in" id="le" type="email" placeholder="Email" autocomplete="username"><input class="in" id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="bt wide" onclick="login()">Sign in</button></div>'}
async function login(){const r=await sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});if(r.error)return alert(r.error.message);S.user=r.data.user;await chkFounder();stack=[];V={n:'home'};if(MODE()==='founder'){if(S.founder)V={n:'dash'};else{alert('This ID is not a founder ID. Staff can use the staff link.');await sb.auth.signOut();S.user=null}}render()}
(async()=>{
  try{const s=await sb.auth.getSession();S.user=s.data.session?s.data.session.user:null;await chkFounder();if(MODE()==='founder'&&S.founder)V={n:'dash'};await base()}
  catch(e){$('app').innerHTML='<div class="pad"><p class="err">'+esc(e.message||e)+'</p></div>';return}
  render();
})();
</script></body></html>
